<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STX - Public Timeline Criptografada</title>
  <!-- Estilos externos consolidados -->
  <link rel="stylesheet" href="./css/estilo.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-body-wrapper">

  <!-- TELA DE LOGIN -->
  <div id="wrapper-login" class="login-wrapper">
    <div class="card">
      <div id="tela-login">
        <h2>STX Platform</h2>
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="senha" placeholder="Sua senha">
        <button onclick="fazerLogin()">Entrar</button>
        <button onclick="fazerCadastro()" class="btn-success">Cadastrar</button>
      </div>
      <p id="status"></p>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="app-layout" class="app-layout oculto">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-brand">STX</div>
      
      <div class="top-bar-info">
        <div class="unread-badge">
          ✉️ <span id="unread-count">0</span> unread messages
        </div>
        <div class="user-tag">
          Logged as <strong id="topbar-username">...</strong>
        </div>
        <button onclick="fazerLogout()" class="btn-logout">Logout</button>
      </div>
    </header>

    <!-- Corpo da Aplicação -->
    <div class="app-body">
      
      <!-- Feed Centralizado -->
      <main class="main-timeline">
        <div class="timeline-header">
          <span>Public Timeline</span>
          <span class="lock-icon">🔒 End-to-End Encrypted</span>
        </div>

        <div id="timeline-messages" class="timeline-messages">
          <!-- Mensagens renderizadas aqui -->
        </div>

        <div class="timeline-input-container">
          <div class="timeline-input-area">
            <input type="text" id="mensagem-input" 
                   placeholder="Escreva uma mensagem na Timeline pública..." 
                   maxlength="1024" 
                   oninput="atualizarContador()" 
                   onkeypress="tratarTeclaEnter(event)">
            <button onclick="enviarMensagemTimeline()">Publicar</button>
          </div>
          <div class="char-counter">
            <span id="char-count">0</span>/1024 caracteres
          </div>
        </div>
      </main>

      <!-- Sidebar Direita (Usuários Online) -->
      <aside class="right-sidebar">
        <div class="sidebar-title">
          <span class="online-dot"></span> Active Users (<span id="count-online">0</span>)
        </div>
        <ul id="lista-online" class="user-list">
          <li>Carregando...</li>
        </ul>
      </aside>

    </div>
  </div>

  <script>
    // --- CONFIGURAÇÃO SUPABASE ---
    const SUPABASE_URL = 'https://hcgogxfpemzpsloudybp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2XLoBioB2zv9ilQTzC5pSw_7AOqEvFC';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SECRET_KEY_STRING = 'STX-Public-Timeline-Secret-Key-2026';

    // --- ELEMENTOS DO DOM ---
    const wrapperLogin = document.getElementById('wrapper-login');
    const appLayout = document.getElementById('app-layout');
    const statusText = document.getElementById('status');
    const topbarUsername = document.getElementById('topbar-username');
    const listaOnline = document.getElementById('lista-online');
    const countOnline = document.getElementById('count-online');
    const timelineMessages = document.getElementById('timeline-messages');
    const mensagemInput = document.getElementById('mensagem-input');
    const unreadCount = document.getElementById('unread-count');
    const charCount = document.getElementById('char-count');

    let canalRealtime = null;
    let usuarioAtual = null;
    let mensagensNaoLidas = 0;

    // --- SEGURANÇA E SANITIZAÇÃO (ANTI-EXPLOIT) ---
    function sanitizarEntrada(input) {
      if (typeof input !== 'string') return '';
      return input
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '')
        .normalize('NFC')
        .trim();
    }

    // --- MÓDULO DE CRIPTOGRAFIA (AES-GCM Web Crypto API) ---
    async function obterChaveCriptografia() {
      const enc = new TextEncoder();
      const keyData = enc.encode(SECRET_KEY_STRING);
      const hash = await crypto.subtle.digest('SHA-256', keyData);
      return crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }

    async function criptografarTexto(texto) {
      const key = await obterChaveCriptografia();
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(texto));

      return {
        encryptedContent: btoa(String.fromCharCode(...new Uint8Array(encrypted))),
        iv: btoa(String.fromCharCode(...iv))
      };
    }

    async function descriptografarTexto(encryptedContentBase64, ivBase64) {
      try {
        const key = await obterChaveCriptografia();
        const encrypted = Uint8Array.from(atob(encryptedContentBase64), c => c.charCodeAt(0));
        const iv = Uint8Array.from(atob(ivBase64), c => c.charCodeAt(0));

        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, encrypted);
        const dec = new TextDecoder();
        return dec.decode(decrypted);
      } catch (e) {
        return "[Erro ao descriptografar mensagem]";
      }
    }

    // --- AUTENTICAÇÃO E NOME ÚNICO ---
    function gerarNomeAleatorio() {
      const palavras = ['Gato', 'Ninja', 'Shadow', 'Fenix', 'Astronaut', 'Falcon', 'Wolf', 'Lord', 'Sir', 'Master', 'Warrior', 'Cyber', 'Viper', 'Atlas'];
      const palavra = palavras[Math.floor(Math.random() * palavras.length)];
      
      // Gera sufixo alfanumérico único para evitar colisões
      const array = new Uint8Array(3);
      crypto.getRandomValues(array);
      const sufixoUnico = Array.from(array, byte => byte.toString(36).padStart(2, '0')).join('').substring(0, 5).toUpperCase();
      
      return `${palavra}_${sufixoUnico}`;
    }

    async function fazerCadastro() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      statusText.innerText = "Criando conta...";

      const usernameGerado = gerarNomeAleatorio();

      const { data, error } = await supabaseClient.auth.signUp({
        email, password: senha,
        options: { data: { username: usernameGerado } }
      });

      if (error) statusText.innerText = "Erro: " + error.message;
      else statusText.innerText = "Cadastro realizado! Faça o login.";
    }

    async function fazerLogin() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      statusText.innerText = "Autenticando...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
      if (error) {
        statusText.innerText = "Erro ao logar: " + error.message;
      } else {
        statusText.innerText = "";
        atualizarInterface(data.user);
      }
    }

    async function fazerLogout() {
      if (canalRealtime) await canalRealtime.unsubscribe();
      await supabaseClient.auth.signOut();
      appLayout.classList.add('oculto');
      wrapperLogin.classList.remove('oculto');
      statusText.innerText = "Você saiu.";
    }

    function atualizarInterface(user) {
      if (user) {
        usuarioAtual = user;
        const isDbAdmin = user.user_metadata?.role === 'admin';
        const username = user.user_metadata?.username || user.email;

        topbarUsername.innerText = isDbAdmin ? `${username} (ADMIN)` : username;

        wrapperLogin.classList.add('oculto');
        appLayout.classList.remove('oculto');

        conectarComunidade(username, isDbAdmin);
        carregarHistoricoTimeline();
      }
    }

    // --- TIMELINE ---
    async function carregarHistoricoTimeline() {
      timelineMessages.innerHTML = '';
      
      const { data, error } = await supabaseClient
        .from('timeline_messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(50);

      if (error) {
        console.error("Erro ao carregar mensagens:", error);
        return;
      }

      const meuNome = usuarioAtual.user_metadata?.username || usuarioAtual.email;

      for (const msg of data) {
        const textoClaro = await descriptografarTexto(msg.encrypted_content, msg.iv);
        adicionarMensagemNaTela(msg.author, textoClaro, msg.author === meuNome, msg.created_at);
      }
    }

    async function enviarMensagemTimeline() {
      const textoBruto = mensagemInput.value;
      const textoSanitizado = sanitizarEntrada(textoBruto);
      
      if (!textoSanitizado) return;
      
      if (textoSanitizado.length > 1024) {
        alert("A mensagem excede o limite máximo de 1024 caracteres.");
        return;
      }

      const meuNome = usuarioAtual.user_metadata?.username || usuarioAtual.email;

      try {
        const { encryptedContent, iv } = await criptografarTexto(textoSanitizado);

        const { error } = await supabaseClient
          .from('timeline_messages')
          .insert([{
            author: meuNome,
            encrypted_content: encryptedContent,
            iv: iv
          }]);

        if (error) {
          alert("Erro ao enviar mensagem: " + error.message);
          return;
        }

        mensagemInput.value = '';
        atualizarContador();
      } catch (err) {
        console.error("Falha ao processar mensagem:", err);
      }
    }

    function atualizarContador() {
      charCount.innerText = mensagemInput.value.length;
    }

    function tratarTeclaEnter(event) {
      if (event.key === 'Enter') enviarMensagemTimeline();
    }

    function adicionarMensagemNaTela(autor, texto, ehMinha, hora) {
      const card = document.createElement('div');
      card.className = ehMinha ? 'message-card my-message' : 'message-card';

      const horaFormatada = hora 
        ? new Date(hora).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
        : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const headerDiv = document.createElement('div');
      headerDiv.className = 'message-header-info';

      const authorSpan = document.createElement('span');
      authorSpan.className = 'message-author';
      authorSpan.textContent = `${autor}${ehMinha ? ' (Você)' : ''}`;

      const timeSpan = document.createElement('span');
      timeSpan.className = 'message-time';
      timeSpan.textContent = horaFormatada;

      headerDiv.appendChild(authorSpan);
      headerDiv.appendChild(timeSpan);

      const bodyDiv = document.createElement('div');
      bodyDiv.className = 'message-body';
      bodyDiv.textContent = texto;

      card.appendChild(headerDiv);
      card.appendChild(bodyDiv);

      timelineMessages.appendChild(card);
      timelineMessages.scrollTop = timelineMessages.scrollHeight;
    }

    // --- REALTIME & PRESENÇA ---
    function conectarComunidade(meuUsername, isAdmin) {
      canalRealtime = supabaseClient.channel('stx_global_channel');

      supabaseClient
        .channel('schema-db-changes')
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'timeline_messages' },
          async (payload) => {
            const novaMsg = payload.new;
            const textoClaro = await descriptografarTexto(novaMsg.encrypted_content, novaMsg.iv);
            const ehMinha = novaMsg.author === meuUsername;

            adicionarMensagemNaTela(novaMsg.author, textoClaro, ehMinha, novaMsg.created_at);

            if (!ehMinha) {
              mensagensNaoLidas++;
              unreadCount.innerText = mensagensNaoLidas;
            }
          }
        )
        .subscribe();

      canalRealtime.on('presence', { event: 'sync' }, () => {
        const state = canalRealtime.presenceState();
        atualizarListaSidebar(state, meuUsername);
      });

      canalRealtime.subscribe(async (status) => {
        if (status === 'SUBSCRIBED' && !isAdmin) {
          await canalRealtime.track({ username: meuUsername });
        }
      });
    }

    function atualizarListaSidebar(state, meuUsername) {
      const usuariosMap = new Map();

      Object.values(state).forEach(presences => {
        presences.forEach(p => {
          if (p.username) usuariosMap.set(p.username, p);
        });
      });

      const lista = Array.from(usuariosMap.keys());
      countOnline.innerText = lista.length;

      if (lista.length === 0) {
        listaOnline.innerHTML = '<li style="padding:10px; color:#94a3b8;">Nenhum usuário online</li>';
        return;
      }

      listaOnline.innerHTML = lista.map(nome => {
        const inicial = nome.charAt(0).toUpperCase();
        const ehVoce = nome === meuUsername ? ' (Você)' : '';
        return `
          <li class="user-item">
            <div class="user-avatar">${inicial}</div>
            <span>${nome}${ehVoce}</span>
          </li>`;
      }).join('');
    }

    async function checarSessao() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) atualizarInterface(session.user);
    }

    checarSessao();
  </script>
</body>
</html>
