<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STX - Plataforma</title>
  <link rel="stylesheet" href="css/estilo.css">
  <style>
    /* Estilos específicos para a Landing Page STX */
    .stx-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Efeito de Logotipo Glow Neon / 3D para STX */
    .stx-logo {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: 8px;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #38bdf8 0%, #0d9488 50%, #4ade80 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(13, 148, 136, 0.4);
      animation: pulseGlow 4s ease-in-out infinite alternate;
      position: relative;
    }

    @keyframes pulseGlow {
      0% {
        filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4));
        transform: scale(1);
      }
      100% {
        filter: drop-shadow(0 0 35px rgba(13, 148, 136, 0.8));
        transform: scale(1.03);
      }
    }

    .stx-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 600;
    }

    /* Botão com efeito de iluminação no hover */
    .btn-entrar {
      display: inline-block;
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      border: none;
      border-radius: var(--radius-md);
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 15px rgba(13, 148, 136, 0.3);
      transition: all 0.3s ease;
    }

    .btn-entrar:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
      background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
    }

    .btn-entrar:active {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="card stx-container">
    <h1 class="stx-logo">STX</h1>
    <p class="stx-subtitle">Sistema Integrado</p>
    
    <a href="access.html" class="btn-entrar">Acessar Plataforma</a>
  </div>

</body>
</html>
